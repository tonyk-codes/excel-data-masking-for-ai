[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetveil"
version = "1.0.0"
description = "Local deterministic tokenization of before-and-after Excel workbook pairs for privacy-safe AI workflow inference."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KONG Chak Wa"}]
keywords = ["excel", "xlsx", "privacy", "hmac", "tokenization", "ai-agent", "workflow", "data-lineage"]
dependencies = ["openpyxl>=3.1.2"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Spreadsheet"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sheetveil = "sheetveil.cli:main"

[tool.setuptools.package-data]
sheetveil = ["*.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
